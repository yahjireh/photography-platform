<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ClickFlicks Photographer Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #000;
        overscroll-behavior-y: none;
        color: #e5e7eb;
      }
      h1, h2, h3, .font-display {
        font-family: 'Playfair Display', serif;
      }
      
      /* Hide scrollbar */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Flowing Gradient Animation */
      @keyframes gradient-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .animate-gradient-flow {
        background-size: 200% 200%;
        animation: gradient-flow 3s ease infinite;
      }

      /* Glowing border effect */
      .gradient-border-mask {
        position: relative;
        padding: 1px;
        border-radius: 1rem;
        background: linear-gradient(90deg, #2DD4BF, #0F766E, #F59E0B, #2DD4BF);
        background-size: 300% 300%;
        animation: gradient-flow 4s linear infinite;
      }
      .gradient-border-content {
        background: #000;
        border-radius: calc(1rem - 1px);
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              brand: {
                DEFAULT: '#0F766E',
                dark: '#115E59',
                light: '#2DD4BF',
              },
              accent: {
                DEFAULT: '#F59E0B',
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
        "framer-motion": "https://esm.sh/framer-motion@^11.0.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
